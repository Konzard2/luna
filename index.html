<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Próximo Cuarto Menguante · Cundinamarca</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Courier+Prime&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:   #0e0e12;
      --paper: #f0ead8;
      --gold:  #b5892a;
      --dim:   #7a7060;
      --light: #e0d8c4;
    }

    html, body {
      height: 100%;
      background: var(--ink);
      color: var(--paper);
      font-family: 'Cormorant Garamond', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* starfield */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 34% 72%, rgba(255,255,255,.4)  0%, transparent 100%),
        radial-gradient(1px 1px at 55%  9%, rgba(255,255,255,.6)  0%, transparent 100%),
        radial-gradient(1px 1px at 78% 43%, rgba(255,255,255,.45) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 85%, rgba(255,255,255,.5)  0%, transparent 100%),
        radial-gradient(1px 1px at 22% 91%, rgba(255,255,255,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 66% 60%, rgba(255,255,255,.5)  0%, transparent 100%),
        radial-gradient(1px 1px at 45% 38%, rgba(255,255,255,.3)  0%, transparent 100%),
        radial-gradient(1.5px 1.5px at  5% 55%, rgba(255,255,255,.7) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 88% 22%, rgba(255,255,255,.6) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3.5rem 3rem 3rem;
      max-width: 480px;
      width: 92%;
      border: 1px solid rgba(181,137,42,.25);
      background: rgba(14,14,18,.72);
      backdrop-filter: blur(4px);
      animation: fadeUp .9s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* decorative rule */
    .card::before, .card::after {
      content: '';
      display: block;
      width: 38px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto;
    }
    .card::before { margin-bottom: 1.6rem; }
    .card::after  { margin-top:    1.6rem; }

    /* moon SVG */
    .moon-wrap {
      margin: 0 auto 1.8rem;
      width: 108px;
      height: 108px;
      position: relative;
    }
    .moon-wrap svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 18px rgba(181,137,42,.35));
      animation: pulse 5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { filter: drop-shadow(0 0 18px rgba(181,137,42,.35)); }
      50%      { filter: drop-shadow(0 0 28px rgba(181,137,42,.6));  }
    }

    .label {
      font-family: 'Courier Prime', monospace;
      font-size: .68rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: .5rem;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 300;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--light);
      margin-bottom: 2rem;
    }

    .date-big {
      font-size: 3rem;
      font-weight: 300;
      line-height: 1;
      color: var(--paper);
      letter-spacing: .02em;
    }
    .date-big span {
      display: block;
      font-style: italic;
      font-size: 1.25rem;
      color: var(--gold);
      margin-top: .25rem;
    }

    .time-line {
      margin-top: 1.1rem;
      font-family: 'Courier Prime', monospace;
      font-size: .9rem;
      color: var(--dim);
      letter-spacing: .08em;
    }
    .time-line strong {
      color: var(--paper);
      font-weight: 400;
    }

    .countdown {
      margin-top: 1.6rem;
      display: flex;
      justify-content: center;
      gap: 1.4rem;
    }
    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .25rem;
    }
    .unit .n {
      font-size: 2rem;
      font-weight: 300;
      line-height: 1;
      color: var(--paper);
      min-width: 2.2ch;
    }
    .unit .u {
      font-family: 'Courier Prime', monospace;
      font-size: .58rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .sep {
      font-size: 2rem;
      font-weight: 300;
      color: var(--gold);
      line-height: 1;
      align-self: flex-start;
      padding-top: .05rem;
    }

    .note {
      margin-top: 1.8rem;
      font-size: .78rem;
      color: var(--dim);
      font-style: italic;
      line-height: 1.6;
    }

    .footer {
      position: fixed;
      bottom: 1.2rem;
      width: 100%;
      text-align: center;
      font-family: 'Courier Prime', monospace;
      font-size: .6rem;
      letter-spacing: .15em;
      color: rgba(122,112,96,.45);
      z-index: 1;
    }
  </style>
</head>
<body>

<div class="card">
  <p class="label">Hola, Mesita</p>
  <h1>Próximo Cuarto Menguante</h1>

  <!-- Waning crescent / last quarter moon SVG -->
  <div class="moon-wrap">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="moonClip">
          <circle cx="50" cy="50" r="44"/>
        </clipPath>
      </defs>
      <!-- full disc -->
      <circle cx="50" cy="50" r="44" fill="#c9a84c" opacity=".18"/>
      <!-- lit left half (waning) -->
      <ellipse cx="50" cy="50" rx="44" ry="44" fill="#d4a843" clip-path="url(#moonClip)"/>
      <!-- shadow ellipse covering right side -->
      <ellipse cx="72" cy="50" rx="38" ry="44" fill="#0e0e12" clip-path="url(#moonClip)"/>
      <!-- rim -->
      <circle cx="50" cy="50" r="44" fill="none" stroke="#b5892a" stroke-width="1.2" opacity=".6"/>
    </svg>
  </div>

  <div id="date-big" class="date-big">—</div>

  <div id="time-line" class="time-line"></div>

  <div class="countdown" id="countdown">
    <div class="unit"><span class="n" id="cd-d">—</span><span class="u">días</span></div>
    <span class="sep">:</span>
    <div class="unit"><span class="n" id="cd-h">—</span><span class="u">horas</span></div>
  </div>
</div>

<div class="footer">Chao, chao, chao. Saludos a los criquitos.</div>

<script>
// ─────────────────────────────────────────────
// Jean Meeus "Astronomical Algorithms" ch. 49
// Returns the UTC Date of a lunar phase near a given Julian Date.
// phase: 0=New, 1=FirstQ, 2=Full, 3=LastQ (waning quarter = 3)
// ─────────────────────────────────────────────
function julianDateToUTC(jd) {
  // JD → Gregorian UTC
  const z = Math.floor(jd + 0.5);
  const f = jd + 0.5 - z;
  let a;
  if (z < 2299161) {
    a = z;
  } else {
    const alpha = Math.floor((z - 1867216.25) / 36524.25);
    a = z + 1 + alpha - Math.floor(alpha / 4);
  }
  const b = a + 1524;
  const c = Math.floor((b - 122.1) / 365.25);
  const d = Math.floor(365.25 * c);
  const e = Math.floor((b - d) / 30.6001);

  const day  = b - d - Math.floor(30.6001 * e);
  const month = e < 14 ? e - 1 : e - 13;
  const year  = month > 2 ? c - 4716 : c - 4715;

  const dayFrac = f; // fractional day in UTC
  const hours = dayFrac * 24;
  const h = Math.floor(hours);
  const m = Math.floor((hours - h) * 60);
  const s = Math.round(((hours - h) * 60 - m) * 60);

  return new Date(Date.UTC(year, month - 1, day, h, m, s));
}

function nextPhase(phase) {
  // phase 3 = last quarter (waning quarter menguante)
  const now = new Date();
  // Approximate current lunation number k (Meeus 49.2)
  const Y = now.getUTCFullYear() + (now.getUTCMonth()) / 12 +
            now.getUTCDate() / 365.25;
  let k = Math.floor((Y - 2000) * 12.3685);
  // advance k until phase is in the future
  // phase offset: 0=new, 0.25=1stQ, 0.5=full, 0.75=lastQ
  const phaseOffset = phase * 0.25;
  k = k + phaseOffset;
  // round k to nearest 0.25 above current
  k = Math.floor(k);

  // try k and k+1 to get the next occurrence strictly in the future
  for (let attempt = 0; attempt < 3; attempt++) {
    const kk = k + attempt;
    const jd = meanPhaseJD(kk, phase);
    const corrected = correctedPhaseJD(jd, kk, phase);
    const date = julianDateToUTC(corrected);
    if (date > now) return date;
  }
}

function meanPhaseJD(k, phase) {
  // k already includes phase offset when calling correctedPhaseJD
  // Meeus 49.1 — k here is the integer lunation
  const kk = k + phase * 0.25;
  const T = kk / 1236.85;
  return 2451550.09766
    + 29.530588861 * kk
    + 0.00015437 * T * T
    - 0.000000150 * T * T * T
    + 0.00000000073 * T * T * T * T;
}

function correctedPhaseJD(JDE, k, phase) {
  const kk = k + phase * 0.25;
  const T  = kk / 1236.85;
  const T2 = T * T;
  const T3 = T2 * T;
  const T4 = T3 * T;

  const E = 1 - 0.002516 * T - 0.0000074 * T2;
  const M  = toRad(2.5534  + 29.10535670 * kk - 0.0000014 * T2 - 0.00000011 * T3);
  const Mp = toRad(201.5643 + 385.81693528 * kk + 0.0107582 * T2 + 0.00001238 * T3 - 0.000000058 * T4);
  const F  = toRad(160.7108 + 390.67050284 * kk - 0.0016118 * T2 - 0.00000227 * T3 + 0.000000011 * T4);
  const Om = toRad(124.7746 - 1.56375588 * kk + 0.0020672 * T2 + 0.00000215 * T3);

  // Last Quarter corrections (Meeus Table 49.a + 49.b)
  let corr = 0;
  if (phase === 3) {
    corr =
       0.1721 * E * Math.sin(M)
      -0.6280       * Math.sin(Mp)
      +0.0 // placeholder
      -0.6241       * Math.sin(Mp)
      +0.1721 * E * Math.sin(M)
      +0.0 * E * Math.cos(M - Mp)  // small
      -0.0481 * E * Math.sin(M + Mp);
    // Simplified but accurate enough — full set:
    corr =
       -0.62801 * Math.sin(Mp)
      + 0.17172 * E * Math.sin(M)
      - 0.01183 * E * Math.sin(M + Mp)
      + 0.00862 * Math.sin(2 * Mp)
      + 0.00804 * Math.sin(2 * F)
      + 0.00454 * E * Math.sin(M - Mp)
      + 0.00204 * E * E * Math.sin(2 * M)
      - 0.00180 * Math.sin(Mp - 2 * F)
      - 0.00070 * Math.sin(Mp + 2 * F)
      - 0.00040 * Math.sin(3 * Mp)
      - 0.00034 * E * Math.sin(2 * Mp - M)
      + 0.00032 * E * Math.sin(M + 2 * F)
      + 0.00032 * E * Math.sin(M - 2 * F)
      - 0.00028 * E * E * Math.sin(Mp + 2 * M)
      + 0.00027 * E * Math.sin(2 * Mp + M)
      - 0.00017 * Math.sin(Om)
      - 0.00005 * Math.sin(Mp - M - 2 * F)
      + 0.00004 * Math.sin(2 * Mp + 2 * F)
      - 0.00004 * Math.sin(Mp + M + 2 * F)
      + 0.00004 * Math.sin(Mp - 2 * M)
      + 0.00003 * Math.sin(Mp + M - 2 * F)
      + 0.00003 * Math.sin(3 * M)
      + 0.00002 * Math.sin(2 * Mp - 2 * F)
      + 0.00002 * Math.sin(Mp - M + 2 * F)
      - 0.00002 * Math.sin(3 * Mp + M);

    // Additional "W" term for quarters:
    const W = 0.00306
      - 0.00038 * E * Math.cos(M)
      + 0.00026 * Math.cos(Mp)
      - 0.00002 * Math.cos(Mp - M)
      + 0.00002 * Math.cos(Mp + M)
      + 0.00002 * Math.cos(2 * F);
    corr -= W; // Last quarter subtracts W
  }

  return JDE + corr;
}

function toRad(deg) { return deg * Math.PI / 180; }

// ─── Timezone offset for Bogotá: UTC-5 (Colombia Time, no DST) ───
const COL_OFFSET = -5 * 60; // minutes

function toColombiaTime(utcDate) {
  const ms = utcDate.getTime() + COL_OFFSET * 60000;
  return new Date(ms);
}

// ─── Formatting ───
const MONTHS_ES = [
  'enero','febrero','marzo','abril','mayo','junio',
  'julio','agosto','septiembre','octubre','noviembre','diciembre'
];
const DAYS_ES = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

function pad(n) { return String(n).padStart(2,'0'); }

function render() {
  const utcPhase = nextPhase(3); // 3 = last quarter
  const col = toColombiaTime(utcPhase);

  const d   = col.getUTCDate();
  const mon = MONTHS_ES[col.getUTCMonth()];
  const yr  = col.getUTCFullYear();
  const dow = DAYS_ES[col.getUTCDay()];
  const hh  = pad(col.getUTCHours());
  const mm  = pad(col.getUTCMinutes());

  document.getElementById('date-big').innerHTML =
    `${d} <span>${mon} ${yr}</span>`;

  document.getElementById('time-line').innerHTML =
    `<strong>${dow}</strong> a las <strong>${hh}:${mm}</strong> (hora Colombia)`;
}

function updateCountdown() {
  const utcPhase = nextPhase(3);
  const now  = Date.now();
  let diff   = Math.max(0, Math.floor((utcPhase - now) / 1000));

  const s = diff % 60; diff = Math.floor(diff / 60);
  const m = diff % 60; diff = Math.floor(diff / 60);
  const h = diff % 24; diff = Math.floor(diff / 24);
  const days = diff;

  document.getElementById('cd-d').textContent = pad(days);
  document.getElementById('cd-h').textContent = pad(h);
  document.getElementById('cd-m').textContent = pad(m);
  document.getElementById('cd-s').textContent = pad(s);
}

render();
updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
